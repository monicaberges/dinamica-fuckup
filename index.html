    background-size:cover, cover;
    background-attachment:fixed, fixed;
    color:var(--text-100);
    font-family:'Red Hat Text',Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px 60px;
  }
  .brand-logo{display:block; height:26px; width:auto; margin:0 0 22px;}
  .brand-logo path{fill:var(--text-100);}
  @keyframes screenIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .screen-enter{animation:screenIn .35s cubic-bezier(.2,.8,.3,1) both;}
  .wrap{width:100%;max-width:460px;}
  .wrap.admin{max-width:760px;}
  .grid2-admin{display:block;}

  /* ---- Responsive: tablet / desktop ---- */
  @media (min-width:720px){
    body{justify-content:center;}
    .wrap{
      max-width:560px;
      background:rgba(8,14,20,0.45);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid var(--divider);
      border-radius:18px;
      padding:48px 52px;
      box-shadow:0 24px 70px rgba(0,0,0,0.5);
    }
    .wrap.admin{max-width:880px;}
    .brand-logo{height:30px; margin-bottom:26px;}
    h1{font-size:32px;}
    p.lead{font-size:15.5px;}
    .zodiac-grid{grid-template-columns:repeat(4,1fr);}
    #deptOptions, #painOptions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    #deptOptions .option, #painOptions .option{margin-bottom:0; display:flex; align-items:center;}
    button.cta{cursor:pointer;}
    button.cta:not(:disabled):hover{background:var(--brand-dark);}
    .option:hover{border-color:rgba(252,207,63,0.5);}
    .grid2-admin{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
    .grid2-admin .panel{margin-bottom:0;}
  }
  @media (min-width:1100px){
    .zodiac-grid{grid-template-columns:repeat(6,1fr);}
  }
  .overline{
    font-weight:700; font-size:12px; letter-spacing:2px;
    color:var(--text-300); text-transform:uppercase; margin:0 0 10px;
  }
  h1{
    font-family:'Red Hat Display',Arial,sans-serif;
    font-weight:900; font-size:26px; line-height:1.2; margin:0 0 8px;
  }
  h1 em{font-style:normal; color:var(--brand-primary);}
  p.lead{font-size:14.5px; line-height:1.5; color:var(--text-300); margin:0 0 24px;}

  .progress{display:flex; gap:5px; margin-bottom:24px;}
  .progress .dot{flex:1; height:3px; border-radius:2px; background:rgba(245,250,255,0.15); transition:background .3s ease;}
  .progress .dot.done{background:var(--brand-primary);}

  .option{
    background:var(--card-bg); border:1px solid var(--divider); border-radius:10px;
    padding:15px 16px; margin-bottom:10px; cursor:pointer;
    font-size:14.5px; font-weight:500; backdrop-filter:blur(6px);
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
    transition:border-color .15s ease, background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .option:active{transform:scale(0.98);}
  .option.selected{
    border-color:var(--brand-primary); background:rgba(252,207,63,0.10); transform:scale(1.01);
    box-shadow:0 2px 10px rgba(252,207,63,0.15);
  }
  .option .sub{display:block; font-size:12.5px; color:var(--text-300); margin-top:3px; font-weight:400;}

  .zodiac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px;}
  .zodiac-grid .option{margin-bottom:0; text-align:center; padding:12px 6px; font-size:13px;}

  label.field-label{display:block; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-300); margin-bottom:6px;}
  input.field{
    width:100%; background:var(--card-bg); border:1px solid var(--divider); border-radius:8px;
    padding:14px; font-family:'Red Hat Text',sans-serif; font-size:15px; color:var(--text-100);
    margin-bottom:18px;
  }
  input.field::placeholder{color:var(--text-300);}
  input.field:focus{outline:none; border-color:var(--brand-primary);}

  button.cta{
    width:100%; font-family:'Red Hat Text',sans-serif; font-weight:700; font-size:15px;
    padding:16px; border-radius:8px; border:none; background:var(--brand-primary); color:var(--bg);
    cursor:pointer; margin-top:4px; transition:transform .1s ease, background .15s ease, opacity .2s ease;
  }
  button.cta:disabled{background:rgba(245,250,255,0.15); color:var(--text-300); cursor:not-allowed;}
  button.cta:not(:disabled):active{background:var(--brand-dark); transform:scale(0.98);}
  button.ghost{
    width:100%; background:transparent; border:none; color:var(--text-300);
    font-family:'Red Hat Text',sans-serif; font-size:13px; padding:12px; cursor:pointer; text-decoration:underline;
  }

  .result-box{text-align:center; padding:20px 0 8px;}
  @keyframes popIn{
    0%{opacity:0; transform:scale(0.7) translateY(10px);}
    65%{opacity:1; transform:scale(1.06) translateY(0);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes photoIn{
    0%{opacity:0; transform:scale(0.85) rotate(-6deg) translateY(10px);}
    70%{opacity:1; transform:scale(1.03) rotate(1deg) translateY(0);}
    100%{opacity:1; transform:scale(1) rotate(0) translateY(0);}
  }
  .result-box .beer-photo{
    display:block; max-width:180px; max-height:260px; width:auto; height:auto;
    margin:14px auto 8px; border-radius:14px;
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    animation:photoIn .7s cubic-bezier(.2,.9,.3,1) both;
  }
  .result-box .beer-name{
    font-family:'Red Hat Display',sans-serif; font-weight:900; font-size:26px; color:var(--brand-primary);
    margin:6px 0 4px; animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both; animation-delay:.15s;
  }
  .result-box .abv{color:var(--text-300); font-size:13px; margin-bottom:18px; animation:fadeUp .4s ease both; animation-delay:.4s;}
  .result-box .pain-tag{
    font-size:13px; font-style:italic; color:var(--brand-primary); opacity:0.9;
    margin-bottom:10px; animation:fadeUp .4s ease both; animation-delay:.48s;
  }
  .result-box .pairing{font-size:14.5px; line-height:1.55; color:var(--text-100); margin-bottom:6px; animation:fadeUp .4s ease both; animation-delay:.55s;}

  /* admin */
  .panel{border:1px solid var(--divider); border-radius:10px; padding:20px; margin-bottom:20px; background:rgba(245,250,255,0.03); box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .panel h2{font-family:'Red Hat Display',sans-serif; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin:0 0 14px; color:var(--text-300);}
  .bar-row{margin-bottom:16px;}
  .bar-row .label-row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-300); margin-bottom:6px;}
  .bar-row .label-row .name{color:var(--text-100); font-weight:700;}
  .bar-track{background:rgba(245,250,255,0.08); border-radius:8px; height:26px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:8px; background:var(--purple-600); min-width:2px; width:0; transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .bar-fill.beer{background:var(--brand-primary);}
  .panel button.admin-btn{
    font-family:'Red Hat Text',sans-serif; font-weight:700; font-size:13px; padding:10px 14px;
    border-radius:8px; border:1px solid var(--divider); background:transparent; color:var(--text-100); cursor:pointer;
  }
  .panel button.admin-btn.primary{background:var(--brand-primary); color:var(--bg); border:none;}
  .panel button.admin-btn.danger{border-color:rgba(240,68,56,0.5); color:#F04438;}
  table.leads{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.leads th{text-align:left; color:var(--text-300); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--divider);}
  table.leads td{padding:6px 8px; border-bottom:1px solid rgba(245,250,255,0.08);}
  .ai-block{border:1px solid var(--divider); border-radius:8px; padding:16px; margin-top:14px; background:rgba(245,250,255,0.04);}
  .ai-block .ai-label{font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-300); margin-bottom:8px;}
  .ai-block .ai-prompt{font-size:11.5px; color:var(--text-300); white-space:pre-wrap; padding:10px; border:1px solid var(--divider); border-radius:8px; margin-bottom:12px; max-height:130px; overflow-y:auto;}
  .ai-block .ai-response{font-size:14.5px; line-height:1.6;}
  .footer-note{text-align:center; font-size:11px; color:var(--text-300); margin-top:30px; line-height:1.5;}
</style>

/* ---- Google Sheets backend (replaces window.storage for standalone hosting) ---- */

async function sheetPost(record){
  try{
    await fetch(SHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight with Apps Script
      body: JSON.stringify(record)
    });
    return true;
  }catch(e){
    console.error("sheet post failed", e);
    return false;
  }
}

async function sheetGetLeads(){
  try{
    const res = await fetch(SHEET_API_URL, { method: "GET" });
    const data = await res.json();
    return (data && data.leads) ? data.leads : [];
  }catch(e){
    console.error("sheet get failed", e);
    return [];
  }
}

function computeCountsFromLeads(leads){
  const counts = emptyCounts();
  const beerNameToId = {};
  Object.keys(BEERS).forEach(id => beerNameToId[BEERS[id].name] = id);
  const deptLabelToId = {};
  DEPARTMENTS.forEach(d => deptLabelToId[d.label] = d.id);

  leads.forEach(l => {
    counts.total += 1;
    const beerId = beerNameToId[l.beer];
    if(beerId) counts.byBeer[beerId] = (counts.byBeer[beerId]||0) + 1;
    const deptId = deptLabelToId[l.department];
    if(deptId) counts.byDept[deptId] = (counts.byDept[deptId]||0) + 1;
  });
  return counts;
}

function emptyCounts(){
  const byBeer = { especial:0, export:0, tripleZero:0 };
  const byDept = {}; DEPARTMENTS.forEach(d => byDept[d.id]=0);
  return { total:0, byBeer, byDept };
}

/* ---------------- QUIZ FLOW (private, per person) ---------------- */

function progressBar(step, total){
  let dots = "";
  for(let i=0;i<total;i++) dots += `<div class="dot ${i<step?'done':''}"></div>`;
  return `<div class="progress">${dots}</div>`;
}

function brandHeader(label){
  return `${ZEBRA_LOGO_SVG}<p class="overline">${label}</p>`;
}

function screenIntro(){
  render(`
    ${brandHeader("FuckUp Nights Zaragoza · Vol. X")}
    <h1>¿Cuál es tu <em>cerveza</em>?</h1>
    <p class="lead">Antes de las charlas queremos conoceros. Contestad unas preguntas rápidas y os decimos qué cerveza Ambar sois — solo lo veréis vosotros, en vuestro móvil.</p>
    <button class="cta" onclick="screenZodiac()">Empezar</button>
  `);
}

function screenZodiac(){
  const options = ZODIAC.map(z => `<div class="option" data-v="${z}" onclick="pickZodiac('${z}')">${z}</div>`).join("");
  render(`
    ${progressBar(1,5)}
    <p class="overline">Para romper el hielo</p>
    <h1>¿Qué signo eres?</h1>
    <p class="lead">Sin motivo aparente. Solo por diversión.</p>
    <div class="zodiac-grid" id="zodiacGrid">${options}</div>
    <button class="cta" id="nextBtn" disabled onclick="screenContact()">Siguiente</button>
  `);
}
function pickZodiac(z){
  state.zodiac = z;
  document.querySelectorAll("#zodiacGrid .option").forEach(el => el.classList.toggle("selected", el.dataset.v === z));
  document.getElementById("nextBtn").disabled = false;
}

function screenContact(){
  render(`
    ${progressBar(2,5)}
    <p class="overline">Para poder deciros algo</p>
    <h1>¿Cómo te llamas?</h1>
    <p class="lead">Lo justo para poder mandarte tu resultado y algo útil después.</p>
    <label class="field-label">Nombre y apellidos</label>
    <input class="field" id="nameInput" placeholder="Nombre y apellidos" value="${state.name}">
    <label class="field-label">Email</label>
    <input class="field" id="emailInput" type="email" placeholder="tú@empresa.com" value="${state.email}">
    <button class="cta" onclick="submitContact()">Siguiente</button>
  `);
}
function submitContact(){
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  if(!name || !email || !email.includes("@")) return;
  state.name = name; state.email = email;
  screenDept();
}

function screenDept(){
  const options = DEPARTMENTS.map(d => `<div class="option" data-v="${d.id}" onclick="pickDept('${d.id}')">${d.label}</div>`).join("");
  render(`
    ${progressBar(3,5)}
    <p class="overline">Vamos a lo importante</p>
    <h1>¿Dónde están los mayores líos de tu empresa?</h1>
    <p class="lead">Elige el área que más dolores de cabeza te da hoy.</p>
    <div id="deptOptions">${options}</div>
    <button class="cta" id="nextBtn2" disabled onclick="screenPain()">Siguiente</button>
  `);
}
function pickDept(id){
  state.deptId = id;
  document.querySelectorAll("#deptOptions .option").forEach(el => el.classList.toggle("selected", el.dataset.v === id));
  document.getElementById("nextBtn2").disabled = false;
}

function screenPain(){
  const dept = DEPARTMENTS.find(d => d.id === state.deptId);
  const options = dept.pains.map(p => `<div class="option" data-v="${p.id}" onclick="pickPain('${p.id}')">${p.text}</div>`).join("");
  render(`
    ${progressBar(4,5)}
    <p class="overline">${dept.label}</p>
    <h1>¿Cuál de estos os frustra más?</h1>
    <p class="lead">El que más veces os haya pasado últimamente.</p>
    <div id="painOptions">${options}</div>
    <button class="cta" id="nextBtn3" disabled onclick="finishQuiz()">Ver mi cerveza</button>
  `);
}
function pickPain(id){
  state.painId = id;
  document.querySelectorAll("#painOptions .option").forEach(el => el.classList.toggle("selected", el.dataset.v === id));
  document.getElementById("nextBtn3").disabled = false;
}

async function finishQuiz(){
  render(`${progressBar(5,5)}<p class="lead">Calculando tu cerveza…</p>`);

  const dept = DEPARTMENTS.find(d => d.id === state.deptId);
  const pain = dept.pains.find(p => p.id === state.painId);
  const beerId = pain.beer;

  await sheetPost({
    name: state.name, email: state.email, zodiac: state.zodiac,
    department: dept.label, pain: pain.text, beer: BEERS[beerId].name
  });

  screenResult(beerId, pain);
}

function screenResult(beerId, pain){
  const beer = BEERS[beerId];
  render(`
    ${brandHeader("FuckUp Nights Zaragoza · Vol. X")}
    <div class="result-box">
      <p class="overline" style="margin-bottom:0;">Tu cerveza es</p>
      <img class="beer-photo" src="${beer.image}" alt="${beer.name}">
      <div class="beer-name">${beer.name}</div>
      <div class="abv">${beer.abv}</div>
      <div class="pain-tag">"${pain.text}"</div>
      <div class="pairing">${pain.resolution}</div>
    </div>
    <button class="ghost" onclick="location.href=location.pathname">Volver a empezar</button>
  `);
}

/* ---------------- ADMIN / PRESENTER DASHBOARD ---------------- */

function barRow(key, label, count, total, isBeer){
  const pct = total > 0 ? Math.round((count/total)*100) : 0;
  const widthPct = total > 0 ? Math.max(2, Math.round((count/total)*100)) : 2;
  return `
    <div class="bar-row" data-row-key="${key}">
      <div class="label-row"><span class="name">${label}</span><span class="count-label">${count} · ${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill ${isBeer?'beer':''}" data-w="${widthPct}" style="width:0%"></div></div>
    </div>`;
}

function updateBarRow(key, count, total){
  const row = document.querySelector(`.bar-row[data-row-key="${key}"]`);
  if(!row) return;
  const pct = total > 0 ? Math.round((count/total)*100) : 0;
  const widthPct = total > 0 ? Math.max(2, Math.round((count/total)*100)) : 2;
  const countLabel = row.querySelector(".count-label");
  if(countLabel) countLabel.textContent = `${count} · ${pct}%`;
  const fill = row.querySelector(".bar-fill");
  if(fill) fill.style.width = widthPct + "%";
}

function animateBars(){
  requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-fill[data-w]").forEach(el=>{
      el.style.width = el.getAttribute("data-w") + "%";
    });
  });
}

function buildAIPrompt(counts){
  const beerLines = Object.keys(BEERS).map(k => `- ${BEERS[k].name}: ${counts.byBeer[k]||0} personas`).join("\n");
  const deptLines = DEPARTMENTS.map(d => `- ${d.label}: ${counts.byDept[d.id]||0} personas`).join("\n");
  return `Eres la voz de marca de Zebra Ventures, hablando en directo en el cierre de una FuckUp Nights en Zaragoza. El público ha contestado en privado, en su móvil, a qué área de su empresa le duele más y qué cerveza Ambar le representa. Estos son los resultados agregados de esta noche (${counts.total||0} personas en total):

Por cerveza:
${beerLines}

Por área de la empresa:
${deptLines}

Escribe un análisis breve (máximo 3-4 frases cortas) para leer en voz alta ante el público, en tono directo y ejecutivo, nunca motivacional ni de gurú. Señala qué dice este resultado agregado sobre las prioridades reales de las empresas presentes esta noche, de forma concreta, no genérica. No uses frases como "siguiente nivel" ni cierres de tipo agencia. No uses emojis.`;
}

async function generateAIAnalysis(){
  aiState.status = "loading";
  await renderAdmin();
  const leads = await sheetGetLeads();
  const counts = computeCountsFromLeads(leads);
  const prompt = buildAIPrompt(counts);
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}] })
    });
    const data = await response.json();
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim() || "No se ha podido generar el análisis.";
    aiState.analysis = { prompt, response:text };
  }catch(e){
    aiState.analysis = { prompt, response:"Error al generar el análisis. Reintenta." };
  }
  aiState.status = "done";
  await renderAdmin();
}

async function resetAll(){
  alert("El borrado de respuestas se hace directamente en la hoja de Google Sheets (borra las filas), no desde aquí.");
}

function renderLeadsTable(leads){
  const wrap = document.getElementById("leadsTableWrap");
  if(!wrap) return;
  if(leads.length === 0){
    wrap.innerHTML = '<span style="color:var(--text-300); font-size:13px;">Aún no hay respuestas.</span>';
  } else {
    const rows = leads.map(l => `<tr><td>${l.name||""}</td><td>${l.email||""}</td><td>${l.department||""}</td><td>${l.beer||""}</td></tr>`).join("");
    wrap.innerHTML = `<table class="leads"><thead><tr><th>Nombre</th><th>Email</th><th>Área</th><th>Cerveza</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}

/* Lightweight refresh: updates numbers/bars/leads in place, no full repaint, no flicker. */
async function refreshAdminData(){
  const leads = await sheetGetLeads();
  const counts = computeCountsFromLeads(leads);

  const totalEl = document.getElementById("totalCount");
  if(totalEl) totalEl.textContent = counts.total || 0;

  Object.keys(BEERS).forEach(k => updateBarRow('beer-'+k, counts.byBeer[k]||0, counts.total||0));
  DEPARTMENTS.forEach(d => updateBarRow('dept-'+d.id, counts.byDept[d.id]||0, counts.total||0));

  renderLeadsTable(leads);
}

async function renderAdmin(){
  document.getElementById("app").className = "wrap admin";
  const leads = await sheetGetLeads();
  const counts = computeCountsFromLeads(leads);
  const aiStatus = aiState.status;
  const aiAnalysis = aiState.analysis;

  const beerBars = Object.keys(BEERS).map(k => barRow('beer-'+k, BEERS[k].name, counts.byBeer[k]||0, counts.total||0, true)).join("");
  const deptBars = DEPARTMENTS.map(d => barRow('dept-'+d.id, d.label, counts.byDept[d.id]||0, counts.total||0, false)).join("");

  render(`
    ${brandHeader("Panel Zebra · privado, no proyectar en pantalla salvo al cierre")}
    <h1>Dinámica de las cervezas — en directo</h1>
    <p class="lead"><b id="totalCount">${counts.total||0}</b> personas han respondido esta noche.</p>

    <div class="grid2-admin">
      <div class="panel">
        <h2>Por cerveza</h2>
        ${beerBars}
      </div>

      <div class="panel">
        <h2>Por área de la empresa</h2>
        ${deptBars}
      </div>
    </div>

    <div class="panel">
      <h2>Análisis con IA (para leer en el cierre)</h2>
      <button class="admin-btn primary" onclick="generateAIAnalysis()" ${aiStatus==="loading"?"disabled":""}>
        ${aiStatus==="loading" ? "Generando…" : "Generar análisis con IA en directo"}
      </button>
      ${(aiStatus==="loading" || aiAnalysis) ? `
        <div class="ai-block">
          ${aiStatus==="loading" ? '<div class="ai-label">Generando…</div>' : `
            <div class="ai-label">Prompt enviado en directo</div>
            <div class="ai-prompt">${(aiAnalysis.prompt||"").replace(/</g,"&lt;")}</div>
            <div class="ai-label">Respuesta de la IA</div>
            <div class="ai-response">${aiAnalysis.response}</div>
          `}
        </div>` : ""}
    </div>

    <div class="panel">
      <h2>Leads capturados</h2>
      <div id="leadsTableWrap"><span class="lead" style="color:var(--text-300);">Cargando…</span></div>
    </div>

    <div class="panel">
      <h2>Mantenimiento</h2>
      <button class="admin-btn danger" onclick="resetAll()">Reiniciar todos los datos</button>
    </div>

    <p class="footer-note">El QR que va al público NO lleva "?admin=1". Esta pantalla es solo para el equipo de Zebra.</p>
  `);
  animateBars();
  renderLeadsTable(leads);
}

/* ---------------- INIT ---------------- */

async function init(){
  if(isAdmin){
    await renderAdmin();
    setInterval(refreshAdminData, 4000);
  } else {
    screenIntro();
  }
}
init();
